
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Muah Chee</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8ef;
            color: #542b19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 350px;
        }

        .back {
            display: inline-block;
            color: #542b19;
            text-decoration: none;
            font-size: 30px;
            margin-bottom: 35px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h2 {
            font-size: 24px;
            margin: 0;
            line-height: 1.2;
        }

        .brand p {
            font-size: 16px;
            font-weight: bold;
            margin-top: 18px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .card h3 {
            text-align: center;
            font-size: 18px;
            margin: 0 0 25px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #e5d8ca;
            border-radius: 7px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #542b19;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #70402b;
        }

        .error {
            color: red;
            font-size: 12px;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/admin-login" class="back">←</a>

    <div class="brand">
        <h2>Penang<br>Muah Chee</h2>
        <p>槟城麻芝</p>
    </div>

    <div class="card">

        <h3>Forgot Password</h3>

        <form action="/admin-forgot-password" method="POST">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">
                Reset Password
            </button>

            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}

        </form>

    </div>

</div>

</body>
</html>
