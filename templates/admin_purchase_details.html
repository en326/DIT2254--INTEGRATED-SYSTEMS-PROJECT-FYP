
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purchase Details</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff8ef;
    color: #542b19;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 18px;
}

header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

header a {
    color: #542b19;
    text-decoration: none;
    font-size: 22px;
}

h3 { margin: 0; font-size: 18px; }

.card {
    background: white;
    border: 1px solid #ead8c3;
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 13px;
}

label {
    display: block;
    font-size: 12px;
    font-weight: bold;
    margin-top: 12px;
}

input, select, textarea {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    border: 1px solid #ead8c3;
    border-radius: 7px;
}

.total {
    background: #f3e5d2;
    font-size: 22px;
    font-weight: bold;
    padding: 15px;
    border-radius: 8px;
    margin-top: 15px;
}

button {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 7px;
    background: #542b19;
    color: white;
    font-weight: bold;
    margin-top: 15px;
    cursor: pointer;
}

.delete {
    background: #a83225;
}
</style>
</head>

<body>
<div class="container">

<header>
    <a href="/admin-purchases">←</a>
    <h3>Purchase Details</h3>
    <a href="/admin-dashboard">⌂</a>
</header>

<div class="card">
    <strong>{{ purchase_id }}</strong>
    <p>Supplier: {{ purchase.supplier_name }}</p>
    <p>Date: {{ purchase.purchase_date }}</p>
</div>

<form method="POST" class="card">

    <label>Supplier Name</label>
    <input type="text" name="supplier_name"
    value="{{ purchase.supplier_name }}" required>

    <label>Contact Number</label>
    <input type="text" name="contact_number"
    value="{{ purchase.contact_number }}">

    <label>Purchase Date</label>
    <input type="date" name="purchase_date"
    value="{{ purchase.purchase_date }}" required>

    <label>Item or Ingredient</label>
    <input type="text" name="material_name"
    value="{{ purchase.material_name }}" required>

    <label>Quantity</label>
    <input type="number" name="quantity"
    min="0.01" step="0.01"
    value="{{ purchase.quantity }}" required>

    <label>Unit</label>
    <select name="unit">
        {% for unit in ["kg", "g", "pack", "box", "pcs", "bottle"] %}
        <option value="{{ unit }}"
        {% if purchase.unit == unit %}selected{% endif %}>
            {{ unit }}
        </option>
        {% endfor %}
    </select>

    <label>Unit Cost (RM)</label>
    <input type="number" name="unit_cost"
    min="0" step="0.01"
    value="{{ purchase.unit_cost }}" required>

    <label>Payment Method</label>
    <select name="payment_method">
        {% for method in ["Cash", "Bank Transfer", "Touch 'n Go eWallet"] %}
        <option value="{{ method }}"
        {% if purchase.payment_method == method %}selected{% endif %}>
            {{ method }}
        </option>
        {% endfor %}
    </select>

    <label>Notes</label>
    <textarea name="notes" rows="3">{{ purchase.notes }}</textarea>

    <div class="total">
        Total: RM{{ "%.2f"|format(purchase.total_cost) }}
    </div>

    <button type="submit">Update Purchase</button>
</form>

<form method="POST"
action="{{ url_for('admin_delete_purchase', purchase_id=purchase_id) }}"
onsubmit="return confirm('Are you sure you want to delete this purchase?');">

    <button type="submit" class="delete">
        Delete Purchase
    </button>

</form>

</div>
</body>
</html>
