
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Confirmation - Muah Chee</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8ef;
            color: #542b19;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .close {
            display: block;
            text-align: right;
            color: #542b19;
            text-decoration: none;
            font-size: 22px;
            margin-bottom: 25px;
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: auto auto 25px;
            border-radius: 50%;
            background: #f5e4c9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 35px 20px;
        }

        h3 {
            font-size: 19px;
            margin: 0 0 15px;
        }

        p {
            font-size: 13px;
            line-height: 1.6;
            color: #806b5d;
            margin-bottom: 25px;
        }

        a.button {
            display: block;
            background: #542b19;
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/admin-login" class="close">×</a>

    <div class="icon">✉</div>

    <div class="card">

        <h3>Check Your Email</h3>

        <p>
            If an admin account is linked to that email address, a password reset link has been sent.
            The link expires in 30 minutes.
        </p>

        <a href="/admin-login" class="button">
            Back to Admin Login
        </a>

    </div>

</div>

</body>
</html>
