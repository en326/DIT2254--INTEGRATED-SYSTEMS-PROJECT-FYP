<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Muah Chee</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #fff8ef;
            color: #542b19;
            font-family: Arial, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 380px;
            padding: 28px;
            border-radius: 14px;
            background: white;
        }
        h2 { text-align: center; margin: 0 0 24px; }
        label { display: block; margin: 16px 0 8px; font-weight: bold; }
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #e5d8ca;
            border-radius: 8px;
        }
        button, .back {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #542b19;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }
        .error { color: #b00020; font-size: 13px; }
    </style>
</head>
<body>
    <main class="card">
        <h2>Set a New Password</h2>
        <form method="POST">
            <label for="password">New password</label>
            <input id="password" name="password" type="password"
                   minlength="8" autocomplete="new-password" required>
            <label for="confirm_password">Confirm new password</label>
            <input id="confirm_password" name="confirm_password" type="password"
                   minlength="8" autocomplete="new-password" required>
            {% if error %}<p class="error">{{ error }}</p>{% endif %}
            <button type="submit">Update Password</button>
        </form>
        <a class="back" href="/admin-login">Back to Admin Login</a>
    </main>
</body>
</html>
