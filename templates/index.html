
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Penang Muah Chee - Home</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8ef;
            margin: 0;
            padding: 25px 15px;
            color: #542b19;
        }

        .container {
            max-width: 430px;
            margin: auto;
            text-align: center;
        }

        .stall-image {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 25px;
            margin: 5px 0;
            color: #75451f;
        }

        .chinese-name {
            font-size: 20px;
            margin: 5px 0 15px;
        }

        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .location {
            font-size: 13px;
            color: #986039;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: #542b19;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
        }

        .btn-event {
            background: white;
            color: #542b19;
            border: 1px solid #e8d8c8;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
</head>

<body>

    <div class="container">

        <img
            src="{{ url_for('static', filename='images/stall.jpeg') }}"
            alt="Penang Muah Chee Stall"
            class="stall-image"
        >

        <h1>Penang Muah Chee</h1>

        <p class="chinese-name">槟城麻芝</p>

        <p class="description">
            Freshly made Penang Muah Chee.<br>
            Choose your favourite size and toppings.
        </p>

        <p class="location">
            📍 Macalister Road, Penang
        </p>

        <a href="/normal-order" class="btn">
            Place Order
        </a>

        <a href="/event-details" class="btn btn-event">
        Event Pre-Order
        </a>

        <div class="footer">
            Freshly Made · Traditional Penang Muah Chee
        </div>

    </div>

</body>
</html>
