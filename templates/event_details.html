
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Pre-Order - Muah Chee</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff8ef;
            margin: 0;
            padding: 20px 15px;
            color: #542b19;
        }

        .container {
            max-width: 430px;
            margin: auto;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .back {
            color: #542b19;
            text-decoration: none;
            font-size: 24px;
        }

        h2 {
            font-size: 20px;
            margin: 0;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .field input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5d8ca;
            border-radius: 8px;
            font-size: 14px;
        }

        .method {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 12px;
        }

        .product {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .product-top {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .product input[type="number"] {
            width: 80px;
            padding: 8px;
            border: 1px solid #e5d8ca;
            border-radius: 8px;
        }

        .topping {
            font-size: 13px;
            margin-top: 10px;
        }

        .total {
            background: #f5e4c9;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #542b19;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile.css') }}">
</head>

<body>

<div class="container">

    <div class="header">
        <a href="/" class="back">←</a>
        <h2>Event Pre-Order</h2>
    </div>

    <form id="eventForm">

        <div class="card">
            <strong>Event Details</strong>

            <div class="field">
                <label>Your Name</label>
                <input type="text" id="customerName"
                       placeholder="Enter your name" required>
            </div>

            <div class="field">
                <label>Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter phone number" required>
            </div>

            <div class="field">
                <label>Event Date</label>
                <input type="date" id="eventDate" required>
            </div>

            <div class="field">
                <label>Event Address</label>
                <input type="text" id="eventAddress"
                       placeholder="Enter event address" required>
            </div>

            <strong>Delivery Method</strong>

            <label class="method">
                <input type="radio" name="delivery"
                       value="Pickup" checked>
                Pickup
            </label>

            <label class="method">
                <input type="radio" name="delivery"
                       value="Made On-Site">
                Made On-Site
            </label>
        </div>

        <div class="card">
            <strong>Select Your Muah Chee</strong>

            <div class="product">
                <div class="product-top">
                    <span>Small Box - RM 3.50</span>
                </div>

                <label>Quantity</label>
                <input type="number" id="smallQty"
                       value="0" min="0">

                <div class="topping">
                    <label>
                        <input type="checkbox" id="smallShallots">
                        Fried Shallots
                    </label>
                </div>

                <div class="topping">
                    <label>
                        <input type="checkbox" id="smallSesame">
                        Black Sesame
                    </label>
                </div>
            </div>

            <div class="product">
                <div class="product-top">
                    <span>Large Box - RM 5.00</span>
                </div>

                <label>Quantity</label>
                <input type="number" id="largeQty"
                       value="0" min="0">

                <div class="topping">
                    <label>
                        <input type="checkbox" id="largeShallots">
                        Fried Shallots
                    </label>
                </div>

                <div class="topping">
                    <label>
                        <input type="checkbox" id="largeSesame">
                        Black Sesame
                    </label>
                </div>
            </div>

            <div class="total">
                <span>Total Portions</span>
                <span id="totalPortions">0</span>
            </div>

            <div class="total" style="margin-top:10px;">
                <span>Estimated Total</span>
                <span id="totalPrice">RM 0.00</span>
            </div>
        </div>

        <button type="submit" class="btn">
            Review Event Order
        </button>

    </form>
</div>

<script>
    const smallQty = document.getElementById("smallQty");
    const largeQty = document.getElementById("largeQty");

    function updateTotal() {
        const small = Math.max(0, Number(smallQty.value) || 0);
        const large = Math.max(0, Number(largeQty.value) || 0);

        document.getElementById("totalPortions").textContent =
            small + large;

        document.getElementById("totalPrice").textContent =
            "RM " + (small * 3.50 + large * 5.00).toFixed(2);
    }

    smallQty.addEventListener("input", updateTotal);
    largeQty.addEventListener("input", updateTotal);

    document.getElementById("eventForm").addEventListener("submit",
        function(event) {
            event.preventDefault();

            const small = Number(smallQty.value) || 0;
            const large = Number(largeQty.value) || 0;

            if (small + large === 0) {
                alert("Please select at least one product.");
                return;
            }

            const eventOrder = {
                customerName: document.getElementById("customerName").value,
                phone: document.getElementById("phone").value,
                eventDate: document.getElementById("eventDate").value,
                eventAddress: document.getElementById("eventAddress").value,
                delivery: document.querySelector(
                    'input[name="delivery"]:checked'
                ).value,
                smallQty: small,
                largeQty: large,
                smallShallots: document.getElementById("smallShallots").checked,
                smallSesame: document.getElementById("smallSesame").checked,
                largeShallots: document.getElementById("largeShallots").checked,
                largeSesame: document.getElementById("largeSesame").checked,
                total: small * 3.50 + large * 5.00
            };

            sessionStorage.setItem(
                "muahCheeEventOrder",
                JSON.stringify(eventOrder)
            );

            window.location.href = "/event-review";
        }
    );

    // Prevent selecting a past event date
    document.getElementById("eventDate").min =
        new Date().toLocaleDateString("en-CA");
</script>

</body>
</html>
